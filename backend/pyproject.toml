[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/**"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "DJ", "S"]
ignore = [
    "S101",  # asserts permitidos en pytest
    # DJ001 sugiere "" en vez de NULL para textos, pero el esquema Go usa
    # columnas text NULL y el contrato OpenAPI distingue null de "": la
    # paridad exige null=True.
    "DJ001",
    # DJ008 (__str__) no aplica: API JSON pura, sin admin ni templates.
    "DJ008",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106"]  # passwords de prueba en factorías
"conftest.py" = ["S106"]
# Harness local de paridad: credenciales de prueba, docker exec y SQL fijo
# contra contenedores efímeros propios — los avisos S no aplican.
"tools/parity.py" = ["S106", "S603", "S607", "S608", "B905"]
# Suites E2E: credenciales sintéticas creadas por la propia prueba.
"tools/e2e_despliegue.py" = ["S105", "B007"]
"tools/e2e_dominios.py" = ["S105", "B007"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "--cov=apps --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
omit = ["*/migrations/*", "*/tests/*", "manage.py", "config/*"]
