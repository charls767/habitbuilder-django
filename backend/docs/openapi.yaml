    get:
      summary: >
        View filtered aggregate statistics: best streak, most-consistent
        habits, and most-skipped habits
      operationId: verEstadisticas
      tags: [estadisticas]
      security:
        - bearerAuth: []
      parameters:
        - name: periodo
          in: query
          required: false
          description: >
            Aggregation period. Defaults to semana (the current week) per
            PROGRESS-01.
          schema:
            type: string
            enum: [semana, mes]
            default: semana
        - name: fecha
          in: query
          required: false
          description: >
            Anchor date (ISO-8601) for the period; defaults to today in the
            user's stored timezone. An out-of-enum periodo value is a 400,
            not a silently-ignored filter.
          schema:
            type: string
            format: date
        - name: habitoId
          in: query
          required: false
          description: >
