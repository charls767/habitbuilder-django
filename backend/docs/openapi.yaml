openapi: 3.0.3
info:
  title: HabitBuilder API
  version: 1.0.0
  description: >
    Contract for the HabitBuilder backend. This is the single synchronization
    point between habitbuilder-backend and habitbuilder-mobile: both repos
    build against this file. Auth, usuarios (profile), habitos, metas,
    recordatorios, registros, progreso, and estadisticas are fully specified.
servers:
  - url: https://habitbuilder-backend-1010445743481.us-central1.run.app
    description: Production (Google Cloud Run)
  - url: http://localhost:8080
    description: Local development

security: []

paths:
  /v1/auth/register:
    post:
      summary: Register a new user
      operationId: registrarUsuario
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistroUsuarioRequest'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistroUsuarioResponse'
        '422':
          description: Validation error (email taken, weak password, terms not accepted)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/auth/login:
    post:
      summary: Log in with email and password
      operationId: iniciarSesion
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated session issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SesionResponse'
        '401':
          description: Invalid credentials (generic — does not reveal account existence)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Account suspended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/auth/reset/request:
    post:
      summary: Request a password-reset link by email
      operationId: solicitarReset
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetRequest'
      responses:
        '200':
          description: >
            Reset request accepted. Always returns 200 regardless of whether
            the email is registered, to avoid revealing account existence.

  /v1/auth/reset/confirm:
    post:
      summary: Confirm a password reset with a token and new password
      operationId: confirmarReset
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetConfirmRequest'
      responses:
        '200':
          description: Password updated successfully
        '400':
          description: Invalid, expired, or already-used reset token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/auth/logout:
    post:
      summary: Log out the current session (stateless no-op; client discards its JWT)
      operationId: cerrarSesion
      tags: [auth]
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Logged out. Stateless no-op — the client discards its JWT; the token itself is not server-side revoked and remains valid until it expires.
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/usuarios/me:
    get:
      summary: View the authenticated user's profile
      operationId: verPerfil
      tags: [usuarios]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerfilResponse'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      summary: Update the authenticated user's profile
      operationId: actualizarPerfil
      tags: [usuarios]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PerfilUpdateRequest'
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerfilResponse'
        '400':
          description: Validation error (invalid timezone, invalid accessibility/notification value)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/habitos:
    get:
      summary: List the authenticated user's habits
      operationId: listarHabitos
      tags: [habitos]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Habits listed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HabitoResponse'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Create a new habit
      operationId: crearHabito
      tags: [habitos]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearHabitoRequest'
      responses:
        '201':
          description: Habit created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HabitoResponse'
        '400':
          description: Validation error (invalid frequency shape, missing required field)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/habitos/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get one of the authenticated user's habits by id
      operationId: obtenerHabito
      tags: [habitos]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Habit found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HabitoResponse'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: >
            Habit not found, or not owned by the authenticated user
            (indistinguishable from not-found to avoid leaking existence).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      summary: Edit an existing habit's mutable fields
      operationId: editarHabito
      tags: [habitos]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditarHabitoRequest'
      responses:
        '200':
          description: Habit updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HabitoResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Habit not found, or not owned by the authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Soft-delete a habit after confirmation
      operationId: eliminarHabito
      tags: [habitos]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: >
            Habit soft-deleted. Returns counts of related records affected,
            so mobile can present a confirmation dialog before the caller
            deletes. Both counts are always zero in this phase — no
            reminders or tracking records exist yet to reference habits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EliminarHabitoResponse'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Habit not found, or not owned by the authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/habitos/{id}/pausar:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Pause an active habit for a date range
      operationId: pausarHabito
      tags: [habitos]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PausarHabitoRequest'
      responses:
        '200':
          description: Habit paused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HabitoResponse'
        '400':
          description: Invalid transition (habit is not currently active)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Habit not found, or not owned by the authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/habitos/{id}/reanudar:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Resume a paused habit
      operationId: reanudarHabito
      tags: [habitos]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Habit resumed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HabitoResponse'
        '400':
          description: Invalid transition (habit is not currently paused)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Habit not found, or not owned by the authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/habitos/{id}/completar:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Mark a habit as completed
      operationId: completarHabito
      tags: [habitos]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Habit marked completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HabitoResponse'
        '400':
          description: Invalid transition (habit is already deleted)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Habit not found, or not owned by the authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/metas:
    get:
      summary: List the authenticated user's goals
      operationId: listarMetas
      tags: [metas]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Goals listed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MetaResponse'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Create a new goal
      operationId: crearMeta
      tags: [metas]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearMetaRequest'
      responses:
        '201':
          description: Goal created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/metas/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get one of the authenticated user's goals by id
      operationId: obtenerMeta
      tags: [metas]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Goal found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaResponse'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: >
            Goal not found, or not owned by the authenticated user
            (indistinguishable from not-found to avoid leaking existence).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      summary: Edit a goal's description and/or target date
      operationId: editarMeta
      tags: [metas]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditarMetaRequest'
      responses:
        '200':
          description: Goal updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Goal not found, or not owned by the authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/metas/{id}/estado:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      summary: >
        Update a goal's status directly. Status is caller-set and never
        derived from linked habits' own states.
      operationId: actualizarEstadoMeta
      tags: [metas]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizarEstadoMetaRequest'
      responses:
        '200':
          description: Goal status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaResponse'
        '400':
          description: Validation error (invalid estado value)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Goal not found, or not owned by the authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/metas/{id}/habitos:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Link one or more of the caller's existing habits to this goal
      operationId: vincularHabitos
      tags: [metas]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VincularHabitosRequest'
      responses:
        '200':
          description: Habits linked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: >
            Goal not found (or not owned), or one of the referenced habitos
            not found/not owned by the authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/metas/{id}/habitos/{habitoId}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: habitoId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      summary: Unlink a single habit from this goal
      operationId: desvincularHabito
      tags: [metas]
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Habit unlinked
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Goal or habito not found, or not owned by the authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/habitos/{id}/recordatorios:
    parameters:
      - name: id
        in: path
        required: true
        description: Habit UUID.
        schema:
          type: string
          format: uuid
    get:
      summary: List every reminder configured for one habit
      operationId: listarRecordatoriosDeHabito
      tags: [recordatorios]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: >
            Reminders configured for the habit. A habit may have any number
            of reminders; an empty array means none are configured.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecordatorioResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      summary: Create an additional reminder for one habit
      operationId: crearRecordatorio
      tags: [recordatorios]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearRecordatorioRequest'
      responses:
        '201':
          description: Reminder created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordatorioResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ReminderConflict'

  /v1/recordatorios/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Reminder UUID.
        schema:
          type: string
          format: uuid
    patch:
      summary: Replace the writable configuration of one reminder
      operationId: editarRecordatorio
      tags: [recordatorios]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditarRecordatorioRequest'
      responses:
        '200':
          description: Reminder updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordatorioResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ReminderConflict'
    delete:
      summary: Delete one reminder and cancel its future notifications
      operationId: eliminarRecordatorio
      tags: [recordatorios]
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Reminder deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /habits/{habitId}/reminders:
    x-alias-of: /v1/habitos/{id}/recordatorios
    parameters:
      - name: habitId
        in: path
        required: true
        description: Habit UUID.
        schema:
          type: string
          format: uuid
    get:
      summary: List every reminder configured for one habit (mobile alias)
      operationId: listHabitReminders
      tags: [recordatorios]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: >
            Reminders configured for the habit. A habit may have any number
            of reminders; an empty array means none are configured.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecordatorioResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      summary: Create an additional reminder for one habit (mobile alias)
      operationId: createHabitReminder
      tags: [recordatorios]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearRecordatorioRequest'
      responses:
        '201':
          description: Reminder created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordatorioResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ReminderConflict'

  /reminders/{reminderId}:
    x-alias-of: /v1/recordatorios/{id}
    parameters:
      - name: reminderId
        in: path
        required: true
        description: Reminder UUID.
        schema:
          type: string
          format: uuid
    patch:
      summary: Replace the writable configuration of one reminder (mobile alias)
      operationId: updateReminder
      tags: [recordatorios]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditarRecordatorioRequest'
      responses:
        '200':
          description: Reminder updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordatorioResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ReminderConflict'
    delete:
      summary: Delete one reminder and cancel future notifications (mobile alias)
      operationId: deleteReminder
      tags: [recordatorios]
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Reminder deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/habitos/{id}/registros:
    parameters:
      - name: id
        in: path
        required: true
        description: Habit UUID.
        schema:
          type: string
          format: uuid
    get:
      summary: List a habit's daily completion records
      operationId: listarRegistrosDeHabito
      tags: [registros]
      security:
        - bearerAuth: []
      parameters:
        - name: desde
          in: query
          required: false
          description: Inclusive lower bound of the fechaLocal range filter.
          schema:
            type: string
            format: date
        - name: hasta
          in: query
          required: false
          description: Inclusive upper bound of the fechaLocal range filter.
          schema:
            type: string
            format: date
      responses:
        '200':
          description: >
            Completion records for the habit, ordered for progress/stats
            consumption. An empty array means no completions are logged yet.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RegistroResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      summary: Log or edit a habit's completion for one local day (idempotent upsert)
      operationId: registrarCompletitud
      tags: [registros]
      security:
        - bearerAuth: []
      description: >
        Idempotent upsert keyed by the (habitoId, usuarioId, fechaLocal)
        natural key. 201 means a fresh record was created; 200 means an
        existing same-day record was overwritten (edited) — this 201-vs-200
        distinction is the unambiguous create-vs-edit signal the mobile
        offline queue relies on to tell a genuine new record apart from an
        upsert collision. There is deliberately no 409 on the natural key:
        a same-day collision is the expected success path, not an error. The
        idempotency key is carried in the request body as fechaLocal, not an
        Idempotency-Key HTTP header, because it IS the domain's
        (habitoId, usuarioId, fechaLocal) uniqueness constraint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrarCompletitudRequest'
      responses:
        '201':
          description: A fresh completion record was created for this local day.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistroResponse'
        '200':
          description: >
            An existing same-day completion record was overwritten (edited).
            This is the expected outcome of a re-POST with the same
            fechaLocal — not an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistroResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

