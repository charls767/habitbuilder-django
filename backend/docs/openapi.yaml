components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Conflict:
      description: The request cannot be completed because its state conflicts with the current resource state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadRequest:
      description: Invalid UUID, malformed JSON, or request validation failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BadRequestError'
    Unauthorized:
      description: Missing, expired, or invalid bearer token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UnauthorizedError'
    Forbidden:
      description: Authenticated user lacks the required administrator role.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ForbiddenError'
    LastAdminConflict:
      description: The operation would remove the last active administrator.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LastAdminConflictError'
    NotFound:
      description: >
        Habit or reminder not found, including a resource that is not owned
        by the authenticated user.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NotFoundError'
    ReminderConflict:
      description: >
        The reminder cannot be created or activated because its habit is
        paused or completed. Editing or deactivating an existing reminder
        remains valid, and one habit may own multiple reminders.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReminderConflictError'

  schemas:
    CrearSolicitudAdministrativaRequest:
      type: object
      required: [motivo]
      properties:
        motivo: {type: string, minLength: 1, maxLength: 500}
    ResolverSolicitudAdministrativaRequest:
      type: object
      required: [decision, razon]
      properties:
        decision: {type: string, enum: [aprobar, rechazar]}
        razon: {type: string, minLength: 1, maxLength: 500}
    SolicitudAdministrativaResponse:
      type: object
      required: [id, usuarioId, motivo, estado, creadoEn, actualizadoEn]
      properties:
        id: {type: string, format: uuid}
        usuarioId: {type: string, format: uuid}
        usuarioNombre: {type: string}
        usuarioEmail: {type: string, format: email}
        motivo: {type: string}
        estado: {type: string, enum: [pendiente, aprobada, rechazada]}
        razonDecision: {type: string}
        creadoEn: {type: string, format: date-time}
        actualizadoEn: {type: string, format: date-time}
        revisadoEn: {type: string, format: date-time, nullable: true}
    RegistroUsuarioRequest:
      type: object
      required: [nombre, email, password, terminosAceptados]
      properties:
        nombre:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        terminosAceptados:
          type: boolean

    RegistroUsuarioResponse:
      type: object
      required: [usuario]
      properties:
        usuario:
          type: object
          required: [id, nombre, email, rol, estado]
          properties:
            id:
              type: string
              format: uuid
            nombre:
              type: string
            email:
              type: string
              format: email
            rol:
              type: string
              enum: [regular, admin]
            estado:
              type: string
              enum: [activo, suspendido]

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    SesionResponse:
      type: object
      required: [token, expiraEn]
      properties:
        token:
          type: string
        expiraEn:
          type: string
          format: date-time
          description: ISO-8601 timestamp when the token expires.

    ResetRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    ResetConfirmRequest:
      type: object
      required: [token, nuevaPassword]
      properties:
        token:
          type: string
        nuevaPassword:
          type: string
          format: password

    ErrorResponse:
      type: object
      required: [mensaje]
      properties:
        mensaje:
          type: string
        errores:
          type: object
          description: Field-level validation errors, keyed by field name.
          additionalProperties:
            type: string

    PerfilResponse:
      type: object
      required: [nombre, email, zonaHoraria, accesibilidad, notificaciones]
      properties:
        nombre:
          type: string
        email:
          type: string
          format: email
        objetivoGeneral:
          type: string
          nullable: true
        zonaHoraria:
          type: string
          description: IANA timezone name, e.g. America/Bogota.
        accesibilidad:
          $ref: '#/components/schemas/AccesibilidadPrefs'
        notificaciones:
          $ref: '#/components/schemas/NotificacionPrefs'

    PerfilUpdateRequest:
      type: object
      description: All fields optional — only provided fields are updated.
      properties:
        objetivoGeneral:
          type: string
          nullable: true
        zonaHoraria:
          type: string
          description: IANA timezone name; validated against the tz database.
        accesibilidad:
          $ref: '#/components/schemas/AccesibilidadPrefs'
        notificaciones:
          $ref: '#/components/schemas/NotificacionPrefs'

    AccesibilidadPrefs:
      type: object
      properties:
        ttsHabilitado:
          type: boolean
          description: Whether text-to-speech is enabled.
        tamanoTexto:
          type: string
          enum: [normal, grande, extra_grande]
        contrasteAlto:
          type: boolean
          description: Whether high-contrast mode is enabled.

    NotificacionPrefs:
      type: object
      properties:
        recordatoriosHabilitados:
          type: boolean
          description: Whether habit reminder notifications are enabled.
        resumenProgresoHabilitado:
          type: boolean
          description: Whether periodic progress-summary notifications are enabled.

    CrearHabitoRequest:
      type: object
      description: >
        Ownership is never accepted from the client — the owning usuario
        comes exclusively from the authenticated JWT's sub claim.
      required: [nombre, fechaInicio, frecuencia]
      properties:
        nombre:
          type: string
        descripcion:
          type: string
          nullable: true
        fechaInicio:
          type: string
          format: date
        frecuencia:
          $ref: '#/components/schemas/FrecuenciaSchema'
        categoria:
          type: string
          nullable: true
        metaId:
          type: string
          format: uuid
          nullable: true
          description: >
            At most one linked goal (HABIT-03) — never an array. A habit
            links to zero or one Meta.

    HabitoResponse:
      type: object
      required: [id, nombre, fechaInicio, frecuencia, estado, creadoEn]
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        descripcion:
          type: string
          nullable: true
        fechaInicio:
          type: string
          format: date
        frecuencia:
          $ref: '#/components/schemas/FrecuenciaSchema'
        categoria:
          type: string
          nullable: true
        metaId:
          type: string
          format: uuid
          nullable: true
        estado:
          type: string
          enum: [activo, pausado, completado, eliminado]
        creadoEn:
          type: string
          format: date-time

    EditarHabitoRequest:
      type: object
      description: All fields optional — only provided fields are updated.
      properties:
        nombre:
          type: string
        descripcion:
          type: string
          nullable: true
        frecuencia:
          $ref: '#/components/schemas/FrecuenciaSchema'
        categoria:
          type: string
          nullable: true
        metaId:
          type: string
          format: uuid
          nullable: true
          description: At most one linked goal — never an array.

    FrecuenciaSchema:
      type: object
      description: >
        Tagged shape discriminated by tipo. diaria needs no other field.
        dias_especificos requires diasSemana (non-empty). n_veces_por_periodo
        requires both veces and periodo.
      required: [tipo]
      properties:
        tipo:
          type: string
          enum: [diaria, dias_especificos, n_veces_por_periodo]
        diasSemana:
          type: array
          description: Required, non-empty, only when tipo = dias_especificos.
          items:
            type: integer
            minimum: 0
            maximum: 6
        veces:
          type: integer
          minimum: 1
          description: Required only when tipo = n_veces_por_periodo.
        periodo:
          type: string
          enum: [semana, mes]
          description: Required only when tipo = n_veces_por_periodo.

    PausarHabitoRequest:
      type: object
      required: [inicio]
      properties:
        inicio:
          type: string
          format: date
        fin:
          type: string
          format: date
          nullable: true
          description: Null means the pause is open-ended until reanudar is called.

    EliminarHabitoResponse:
      type: object
      required: [habito, impacto]
      properties:
        habito:
          $ref: '#/components/schemas/HabitoResponse'
        impacto:
          type: object
          description: >
            Counts of related records affected by this delete, computed
            defensively against Reminders/Tracking tables if they exist.
            Always zero in this phase — no reminders or tracking records
            exist yet to reference habits.
          required: [recordatoriosAfectados, registrosAfectados]
          properties:
            recordatoriosAfectados:
              type: integer
              minimum: 0
            registrosAfectados:
              type: integer
              minimum: 0

    CrearMetaRequest:
      type: object
      description: >
        Ownership is never accepted from the client — the owning usuario
        comes exclusively from the authenticated JWT's sub claim. A goal
        needs zero linked habitos to be valid (GOAL-04).
      required: [descripcion, fechaObjetivo]
      properties:
        descripcion:
          type: string
        fechaObjetivo:
          type: string
          format: date

    MetaResponse:
      type: object
      required: [id, descripcion, fechaObjetivo, estado, creadoEn]
      properties:
        id:
          type: string
          format: uuid
        descripcion:
          type: string
        fechaObjetivo:
          type: string
          format: date
        estado:
          type: string
          enum: [en_progreso, lograda, pausada, cancelada]
          description: >
            Caller-set state, independent of linked habitos' own states —
            never derived from them (GOAL-03).
        creadoEn:
          type: string
          format: date-time

    EditarMetaRequest:
      type: object
      description: All fields optional — only provided fields are updated.
      properties:
        descripcion:
          type: string
        fechaObjetivo:
          type: string
          format: date

    ActualizarEstadoMetaRequest:
      type: object
      required: [estado]
      properties:
        estado:
          type: string
          enum: [en_progreso, lograda, pausada, cancelada]

    VincularHabitosRequest:
      type: object
      required: [habitoIds]
      properties:
        habitoIds:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid

    RecordatorioMutableFields:
      type: object
      description: >
        Provider-neutral reminder fields. Weekdays use ISO-8601 numbering:
        Monday=1 through Sunday=7.
      properties:
        mensaje:
          type: string
          minLength: 1
          maxLength: 280
        hora:
          type: string
          pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]$'
          example: '08:30'
          description: Local wall-clock time in strict 24-hour HH:mm form.
        diasSemana:
          type: array
          minItems: 1
          maxItems: 7
          uniqueItems: true
          items:
            type: integer
            minimum: 1
            maximum: 7
          description: Unique ISO weekdays, Monday=1 through Sunday=7.
        activo:
          type: boolean

    CrearRecordatorioRequest:
      allOf:
        - $ref: '#/components/schemas/RecordatorioMutableFields'
      required: [mensaje, hora, diasSemana, activo]
      description: >
        All scheduling fields are required. habitoId and usuarioId are never
        accepted in the body: the habit comes from the path and ownership
        comes from the authenticated JWT.

    EditarRecordatorioRequest:
      allOf:
        - $ref: '#/components/schemas/RecordatorioMutableFields'
      required: [mensaje, hora, diasSemana, activo]
      description: >
        Complete replacement of the writable reminder configuration. All four
        fields are required so edits and active-state changes preserve the
        schedule.

    RecordatorioResponse:
      allOf:
        - type: object
          properties:
            id:
              type: string
              format: uuid
            habitoId:
              type: string
              format: uuid
        - $ref: '#/components/schemas/RecordatorioMutableFields'
      required: [id, habitoId, mensaje, hora, diasSemana, activo]

    RegistroMutableFields:
      type: object
      description: >
        Writable completion fields for one habit-day record.
      properties:
        estado:
          type: string
          enum: [hecho, parcial, omitido]
          description: >
            Completion status for the local day: hecho=done, parcial=partial,
            omitido=skipped.
        nota:
          type: string
          nullable: true
          maxLength: 500
          description: >
            Optional free-text note. May contain personal or health
            information and must never be written to application logs.

    RegistrarCompletitudRequest:
      allOf:
        - $ref: '#/components/schemas/RegistroMutableFields'
        - type: object
          properties:
            fechaLocal:
              type: string
              format: date
              description: >
                The user's local calendar date (ISO-8601) this completion is
                for. This is the idempotency key for the upsert — at most one
                record exists per (habitoId, usuarioId, fechaLocal), and
                re-sending a POST with the same fechaLocal overwrites (edits)
                that day's record instead of creating a duplicate, so the
                offline queue can safely retry. It is resolved in the user's
                stored IANA timezone (zonaHoraria from their profile), never
                the device's raw UTC clock. The client computes it from the
                cached stored profile timezone and sends it explicitly so a
                queued action replayed days later still records the day it
                was actually taken.
      required: [fechaLocal, estado]
      description: >
        habitoId and usuarioId are never accepted in the body: the habit
        comes from the path and ownership comes from the authenticated JWT.

    RegistroResponse:
      allOf:
        - type: object
          properties:
            id:
              type: string
              format: uuid
            habitoId:
              type: string
              format: uuid
            fechaLocal:
              type: string
              format: date
            creadoEn:
              type: string
              format: date-time
            actualizadoEn:
              type: string
              format: date-time
        - $ref: '#/components/schemas/RegistroMutableFields'
      required: [id, habitoId, fechaLocal, estado, creadoEn, actualizadoEn]

    ProgresoResponse:
      type: object
      description: >
        Computed progress for one habit over a selected period, derived
        on-demand from RegistroHabito history — never separately stored or
        mutable.
      properties:
        habitoId:
          type: string
          format: uuid
        periodoDesde:
          type: string
          format: date
        periodoHasta:
          type: string
          format: date
        rachaActual:
          type: integer
          description: Current streak length, scheduled-occurrence-aware.
        rachaMasLarga:
          type: integer
          description: Longest streak length on record for this habit.
        porcentaje:
          type: number
          minimum: 0
          maximum: 100
          description: >
            Completion percentage computed against the habit's scheduled
            occurrences for the period (not raw calendar days).
        estado:
          type: string
          enum: [con_datos, sin_datos]
          description: >
            sin_datos means the habit has no completions in the period
            (PROGRESS-05 empty state) — a contract-first field so the empty
            state is never inferred from zeroed numbers.
      required: [habitoId, periodoDesde, periodoHasta, rachaActual, rachaMasLarga, porcentaje, estado]

    EstadisticaHabito:
      type: object
      description: One habit's aggregate standing within a statistics period.
      properties:
        habitoId:
          type: string
          format: uuid
        nombre:
          type: string
        porcentaje:
          type: number
          minimum: 0
          maximum: 100
        rachaMasLarga:
          type: integer
        totalHecho:
          type: integer
        totalOmitido:
          type: integer
      required: [habitoId, nombre, porcentaje, rachaMasLarga, totalHecho, totalOmitido]

    EstadisticasResponse:
      type: object
      description: >
        Filtered aggregate statistics across the user's habits for a period.
        Remains queryable for historical periods even after a related habit
        is completed or deleted (STATS-03).
      properties:
        periodoDesde:
          type: string
          format: date
        periodoHasta:
          type: string
          format: date
        porcentaje:
          type: number
          minimum: 0
          maximum: 100
        mejorRacha:
          type: integer
          description: Best streak across all matching habits in the period.
        masConsistentes:
          type: array
          items:
            $ref: '#/components/schemas/EstadisticaHabito'
        masOmitidos:
          type: array
          items:
            $ref: '#/components/schemas/EstadisticaHabito'
        estado:
          type: string
          enum: [con_datos, insuficiente]
          description: >
            insuficiente means there is not enough history in the period to
            compute meaningful statistics (STATS-04) — a contract-first
            field so the insufficient-data message is never inferred.
      required: [periodoDesde, periodoHasta, porcentaje, mejorRacha, masConsistentes, masOmitidos, estado]

    CrearPublicacionRequest:
      type: object
      required: [contenido]
      properties:
        contenido: {type: string, minLength: 1, maxLength: 1000}
        habitoId: {type: string, format: uuid}

    EditarPublicacionRequest:
      type: object
      required: [contenido]
      properties:
        contenido: {type: string, minLength: 1, maxLength: 1000}

    PublicacionResponse:
      type: object
      required: [id, autorNombre, contenido, creadoEn, actualizadoEn, reacciones, comentarios, reaccionada]
      properties:
        id: {type: string, format: uuid}
        autorNombre: {type: string}
        contenido: {type: string}
        habitoId: {type: string, format: uuid}
        creadoEn: {type: string, format: date-time}
        actualizadoEn: {type: string, format: date-time}
        reacciones: {type: integer, minimum: 0}
        comentarios: {type: integer, minimum: 0}
        reaccionada: {type: boolean}

    CrearComentarioRequest:
      type: object
      required: [contenido]
      properties:
        contenido: {type: string, minLength: 1, maxLength: 500}

    ComentarioResponse:
      type: object
      required: [id, publicacionId, autorNombre, contenido, creadoEn]
      properties:
        id: {type: string, format: uuid}
        publicacionId: {type: string, format: uuid}
        autorNombre: {type: string}
        contenido: {type: string}
        creadoEn: {type: string, format: date-time}

    CrearReporteRequest:
      type: object
      required: [motivo]
      properties:
        motivo: {type: string, enum: [spam, acoso, inapropiado, otro]}
        detalle: {type: string, maxLength: 500}

    ReporteResponse:
      type: object
      required: [id, publicacionId, motivo, estado, creadoEn]
      properties:
        id: {type: string, format: uuid}
        publicacionId: {type: string, format: uuid}
        motivo: {type: string, enum: [spam, acoso, inapropiado, otro]}
        estado: {type: string, enum: [pendiente]}
        creadoEn: {type: string, format: date-time}

    ContenidoInspiracionResponse:
      type: object
      required: [id, tipo, titulo, resumen, url, autor, destacado, creadoEn, actualizadoEn]
      properties:
        id: {type: string, format: uuid}
        tipo: {type: string, enum: [articulo, video, audio]}
        titulo: {type: string, minLength: 1, maxLength: 180}
        resumen: {type: string, minLength: 1, maxLength: 500}
        url: {type: string, minLength: 1, maxLength: 2048}
        imagenUrl: {type: string}
        autor: {type: string}
        destacado: {type: boolean}
        creadoEn: {type: string, format: date-time}
        actualizadoEn: {type: string, format: date-time}

    ContenidoInspiracionAdminResponse:
      allOf:
        - $ref: '#/components/schemas/ContenidoInspiracionResponse'
        - type: object
          required: [publicado]
          properties:
            publicado: {type: boolean}

    ContenidoInspiracionAdminRequest:
      type: object
      required: [tipo, titulo, resumen, url, autor]
      properties:
        tipo: {type: string, enum: [articulo, video, audio]}
        titulo: {type: string, minLength: 1, maxLength: 180}
        resumen: {type: string, minLength: 1, maxLength: 500}
        url: {type: string, minLength: 1, maxLength: 2048}
        imagenUrl: {type: string, maxLength: 2048}
        autor: {type: string, minLength: 1, maxLength: 180}
        destacado: {type: boolean}
        publicado: {type: boolean}

    UsuarioAdminResponse:
      type: object
      required: [id, nombre, email, rol, estado]
      properties:
        id: {type: string, format: uuid}
        nombre: {type: string}
        email: {type: string, format: email}
        rol: {type: string, enum: [regular, admin]}
        estado: {type: string, enum: [activo, suspendido]}

    CambiarEstadoUsuarioRequest:
      type: object
      required: [estado, razon]
      properties:
        estado: {type: string, enum: [activo, suspendido]}
        razon: {type: string, minLength: 1, maxLength: 500}

    CambiarRolUsuarioRequest:
      type: object
      required: [rol, razon]
      properties:
        rol: {type: string, enum: [regular, admin]}
        razon: {type: string, minLength: 1, maxLength: 500}

    LastAdminConflictError:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          required: [codigo]
          properties:
            codigo:
              type: string
              enum: [last_admin_protection]

    ReporteUsoAdminResponse:
      type: object
      required: [periodoDesde, periodoHasta, usuariosRegistrados, usuariosActivos, habitosCreados, registrosCreados, publicaciones]
      properties:
        periodoDesde: {type: string, format: date-time}
        periodoHasta: {type: string, format: date-time}
        usuariosRegistrados: {type: integer, minimum: 0}
        usuariosActivos: {type: integer, minimum: 0}
        habitosCreados: {type: integer, minimum: 0}
        registrosCreados: {type: integer, minimum: 0}
        publicaciones: {type: integer, minimum: 0}

    ReporteModeracionResponse:
      type: object
      required: [id, publicacionId, motivo, estado, creadoEn]
      properties:
        id: {type: string, format: uuid}
        publicacionId: {type: string, format: uuid}
        motivo: {type: string, enum: [spam, acoso, inapropiado, otro]}
        detalle: {type: string}
        estado: {type: string, enum: [pendiente, resuelto, descartado]}
        creadoEn: {type: string, format: date-time}

    ResolverReporteRequest:
      type: object
      required: [resolucion, razon]
      properties:
        resolucion: {type: string, enum: [aprobar, ocultar]}
        razon: {type: string, maxLength: 500}

    BadRequestError:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          required: [codigo]
          properties:
            codigo:
              type: string
              enum: [invalid_request]

    UnauthorizedError:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          required: [codigo]
          properties:
            codigo:
              type: string
              enum: [unauthorized]

    ForbiddenError:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          required: [codigo]
          properties:
            codigo:
              type: string
              enum: [forbidden]

    NotFoundError:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          required: [codigo]
          properties:
            codigo:
              type: string
              enum: [not_found]

    ReminderConflictError:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          required: [codigo]
          properties:
            codigo:
              type: string
              enum: [habit_inactive_for_reminder]
