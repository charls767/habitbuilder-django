# Blueprint de Render para el backend de HabitBuilder.
#
# Render lee este archivo al crear un "Blueprint" desde el repositorio y deja el
# servicio configurado sin tocar formularios. Usa el Dockerfile de producción que
# ya existe, que aplica las migraciones al arrancar y sirve con gunicorn.
#
# Solo hay que introducir dos valores en el panel (marcados con sync: false):
#   DATABASE_URL   la cadena de conexión de Neon (usa el endpoint "pooled")
#   ALLOWED_HOSTS  opcional: Render inyecta RENDER_EXTERNAL_HOSTNAME y settings.py
#                  lo añade automáticamente, así que puede quedar vacío
services:
  - type: web
    name: habitbuilder-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      # Claves generadas por Render: nunca viajan por el repositorio.
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: JWT_SIGNING_KEY
        generateValue: true

      # Secreto que debes pegar tú en el panel (Neon).
      - key: DATABASE_URL
        sync: false
      - key: DB_SSLMODE
        value: require

      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        sync: false

      - key: JWT_ACCESS_MINUTES
        value: "15"
      - key: JWT_REFRESH_DAYS
        value: "7"
      - key: LOG_LEVEL
        value: INFO

      # El navegador aplica política de origen cruzado: sin esto, el cliente
      # web recibe las respuestas bloqueadas aunque la API responda 200.
      - key: CORS_ALLOWED_ORIGINS
        value: https://habitbuilder-web.onrender.com

  # ---------------------------------------------------------------------
  # Cliente Flutter compilado para navegador. Es el mismo codigo que la app
  # movil; solo cambia el objetivo de compilacion.
  # ---------------------------------------------------------------------
  - type: web
    name: habitbuilder-web
    runtime: static
    rootDir: mobile
    buildCommand: >-
      git clone https://github.com/flutter/flutter.git -b stable --depth 1 "$HOME/flutter" &&
      export PATH="$HOME/flutter/bin:$PATH" &&
      flutter pub get &&
      dart run build_runner build --delete-conflicting-outputs &&
      flutter build web --release
      --dart-define=API_BASE_URL=https://habitbuilder-api.onrender.com
    staticPublishPath: build/web
    routes:
      # go_router usa rutas del lado del cliente: cualquier ruta profunda
      # debe servir index.html o una recarga daria 404.
      - type: rewrite
        source: /*
        destination: /index.html
