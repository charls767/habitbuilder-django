# Blueprint de Render para el backend de HabitBuilder.
#
# Render lee este archivo al crear un "Blueprint" desde el repositorio y deja el
# servicio configurado sin tocar formularios. Usa el Dockerfile de producción que
# ya existe, que aplica las migraciones al arrancar y sirve con gunicorn.
#
# Solo hay que introducir dos valores en el panel (marcados con sync: false):
#   DATABASE_URL   la cadena de conexión de Neon (usa el endpoint "pooled")
#   ALLOWED_HOSTS  opcional: Render inyecta RENDER_EXTERNAL_HOSTNAME y settings.py
#                  lo añade automáticamente, así que puede quedar vacío
services:
  - type: web
    name: habitbuilder-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      # Claves generadas por Render: nunca viajan por el repositorio.
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: JWT_SIGNING_KEY
        generateValue: true

      # Secreto que debes pegar tú en el panel (Neon).
      - key: DATABASE_URL
        sync: false
      - key: DB_SSLMODE
        value: require

      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        sync: false

      - key: JWT_ACCESS_MINUTES
        value: "15"
      - key: JWT_REFRESH_DAYS
        value: "7"
      - key: LOG_LEVEL
        value: INFO
