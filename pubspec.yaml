name: habitbuilder_mobile
description: "HabitBuilder mobile app (Flutter) — Calidad de Software 2025-2."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3

  # Navigation
  go_router: ^17.3.0

  # Networking
  dio: ^5.11.0

  # Secure token storage (never SharedPreferences for auth tokens)
  flutter_secure_storage: ^10.3.1

  # Reminders — local notifications, always via TZDateTime, never naive DateTime
  flutter_local_notifications: ^22.2.0
  timezone: ^0.11.1

  # DTOs / immutable models
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

  build_runner: ^2.4.0
  riverpod_generator: ^4.0.4
  freezed: ^3.2.5
  json_serializable: ^6.14.0

flutter:
  uses-material-design: true
