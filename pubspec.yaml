name: habitbuilder_mobile
description: HabitBuilder mobile client (Flutter) — feature-first skeleton.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0 <3.45.0"

dependencies:
  flutter:
    sdk: flutter

  # State management (code-gen)
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3

  # Navigation
  go_router: ^17.3.0

  # Networking
  dio: ^5.11.0

  # Local reminder scheduling (D-16 verified exact pins)
  flutter_local_notifications: 22.2.0
  timezone: 0.11.1

  # Secure token storage
  flutter_secure_storage: ^10.3.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.4.0
  riverpod_generator: ^4.0.4
  mocktail: ^1.0.5
  riverpod_lint: ^3.1.4
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
